<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body id="kt_body" style="padding: 0; margin: 0; background-color: #f8f9fa; font-family: Arial, Helvetica, sans-serif;">
	<div style="background-color: #f8f9fa; padding: 30px 10px;">
		<div style="background-color: #ffffff; padding: 35px 20px; border-radius: 12px; margin: 0 auto; max-width: 480px; box-shadow: 0 4px 10px rgba(0,0,0,0.03);">
			<table align="center" border="0" cellpadding="0" cellspacing="0" width="100%" style="border-collapse: collapse;">
				<tbody>
					<tr>
						<td align="center" valign="top" style="text-align: center;">
							<div style="text-align: center;">

								<!--begin:Logo-->
								<div style="margin-bottom: 25px;">
									<img alt="Bookify Logo" src="https://res.cloudinary.com/dhtvvjlko/image/upload/v1784985004/logo_xxv8zk.png" style="max-width: 140px; height: auto; display: block; margin: 0 auto;" border="0" />
								</div>
								<!--end:Logo-->
								<!--begin:Media-->
								<div style="margin-bottom: 25px;">
									<img alt="Welcome Illustration" src="[imageUrl]" style="width: 200px; max-width: 100%; height: auto; display: block; margin: 0 auto;" border="0" />
								</div>
								<!--end:Media-->
								<!--begin:Text-->
								<div style="font-size: 15px; font-weight: 500; margin-bottom: 25px;">
									<p style="margin: 0 0 10px 0; color: #181C32; font-size: 20px; font-weight: 700; line-height: 1.3;">[header]</p>
									<p style="margin: 0; color: #7E8299; font-size: 14px; line-height: 1.6;">[body]</p>
								</div>
								<!--end:Text-->
								<!--begin:Action-->
								<div style="margin-top: 10px;">
									<a href='[url]' target="_blank" style="background-color: #009ef7; border-radius: 6px; display: inline-block; padding: 12px 28px; color: #FFFFFF; font-size: 14px; font-weight: 600; text-decoration: none; box-shadow: 0 3px 6px rgba(0,158,247,0.2);">[linkTitle]</a>
								</div>
								<!--end:Action-->

							</div>
						</td>
					</tr>
				</tbody>
			</table>
		</div>
	</div>
</body>
</html>
