<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to Bookify!</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 0;
            direction: ltr;
        }

        .container {
            max-width: 600px;
            margin: 40px auto;
            background-color: #ffffff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .header {
            background-color: #ffffff;
            padding: 30px;
            text-align: center;
            border-bottom: 1px solid #eeeeee;
        }

        .logo {
            max-width: 160px;
            height: auto;
        }

        .content {
            padding: 40px 30px;
            text-align: center;
        }

        h1 {
            color: #2c3e50;
            font-size: 24px;
            margin-bottom: 15px;
        }

        p {
            color: #666666;
            font-size: 16px;
            line-height: 1.6;
            margin: 0;
        }

        .footer {
            background-color: #f9f9f9;
            padding: 20px;
            text-align: center;
            font-size: 12px;
            color: #999999;
            border-top: 1px solid #eeeeee;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Logo Header -->
        <div class="header">
            <img src="[logoUrl]" alt="Bookify Logo" class="logo" />
        </div>

        <!-- Main Content -->
        <div class="content">
            <h1>[header]</h1>
            <p>[body]</p>
        </div>

        <!-- Footer -->
        <div class="footer">
            <p>© Bookify. All rights reserved.</p>
        </div>
    </div>

</body>
</html>
